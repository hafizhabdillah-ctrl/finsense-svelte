  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Text -->
  <text x="100" y="110" font-family="Poppins, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="#ffffff">Fin</text>
  <text x="100" y="110" font-family="Poppins, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="#06b6d4" text-length="40">Sense</text>
  
  <!-- Icon -->
  <path d="M 70 80 L 100 60 L 130 80 L 130 120 Q 130 135 120 140 L 80 140 Q 70 135 70 120 Z" 
